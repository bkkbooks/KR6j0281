body:
  text: 若有沙門若婆羅門諸善男子善女人等欲受持菩薩法者應作四肘壇當覓勝地清淨之所掃灑清淨以香水牛糞埿地懸於種種雜色幡蓋寶鈴珮鏡并諸金銀種種間錯嚴錺道場其道場中立五色壇縱廣四肘先下白色次黃次赤次黑而作四門其壇中心作蓮華座安置何耶揭利婆觀世音像東門作華座安十一面菩薩北門作蓮華座安八臂觀世音南方安八龍王難陀龍王婆素難龍王德叉迦龍王羯固奼龍王般摩龍王摩訶般摩龍王商佉波羅龍王鳩利迦龍王八龍唯供粳米乳糜餘者以種種供養亦得燃四十五燈先喚八箇龍王用何耶揭唎婆身印來去唵闍去音耶毗闍去音耶二阿瑟吒二合那去聲伽羅闍耶三阿羅闡都四莎訶五其壇西門近南安一火爐以胡麻稻穀華等蘇蜜相和誦心呪投火中燒之滿一千八遍次請中心何耶揭唎婆菩薩次請八臂觀音身印來去唵一夜勢夜輒擔二莎訶次用華座印來去請十一面菩薩已散種種花燒諸名香沈水薰陸栴檀香等而供養之呪師一日不食若不忍飢唯得食蘇香湯洗浴著新淨衣入道場中而作供養常得觀世音菩薩憶念亦兼通軍荼利法結界供養也當以真言印護身及結界呪木七返或呪水七返又以印呪水或呪白芥子灰等七返將木竪四角為界芥子灰水散於十方閒成結界二手外縛二食指直竪相去五分許並二大指相著各屈一節勿著食指真言曰唵一鉢羅毗迦悉跢二跋折羅三涉筏二合囉囉上音支四莎訶何耶揭唎婆解禁刀印舒二手左手在外右手在內以左掌著右手背竪二手大指唵一阿娑忙義儞二莎呵三句何耶揭唎婆大法身印二手外縛以二小指竪相合並二大指竪相著屈怒大指來去唵一杜那杜那二摩他摩他三可馱可馱四訶耶揭唎婆五嗚吽泮六莎去音訶七次何耶揭唎婆心印二手外縛並二大指相著各屈一節勿著食指大指來去唵一阿蜜唎都智二合婆平音二嗚𤙖泮三莎去音訶次頭印二手外縛立二食指頭相拄各屈二大指節小指頭尖也跢姪他一斫迦羅𭈖怖二斫迦羅去音乞叉𭈖怖三斫迦羅跛曇摩叉唎怖四阿謨迦去音寫稱彼人名五始羅上音枳羅上音二合六跛羅舍網伽車上音覩七莎訶八叉去沙反餘處皆然次頂印準前頭印唯改竪二食指頭相著列二中指在二食指前頭相拄唵一室唎二合羅唎至二嗚𤙖泮三莎去訶四次口印二手小指無名指內相叉二中指頭相拄並竪二大指以右風捻右大頭左頭指竪小曲在中指邊唵一鶻嚕嚧二鳩嚧馱那三嗚𤙖泮四莎訶次牙印準前觀世音不空羂索菩薩牙印上準改二中指直竪頭相著二大指並竪博中指先以左小指握右無名指背後以右小指握左小指背南上音謨上囉跢那二合怛囉二合夜耶一南謨阿唎耶二婆盧吉帝三攝婆二合羅去耶四菩提薩埵去耶五摩訶薩埵去耶摩訶迦盧尼迦耶七跢姪他八跢羅上二合吒九跢羅上二合吒十末吒末吒十一瞋陀瞋陀十二頻陀頻陀十三嗚𤙖十四泮泮十五莎訶何耶揭唎婆觀世音菩薩大呪又何耶揭唎婆別大呪在別是二呪者波帝吒悉陀波泮底唐云隨誦成驗雖不受持壇供養法隨誦成驗若欲發遣何耶揭唎婆觀世音者手執素羅毗布瑟波二合反又云柏花呪一遍已一打像上如是七遍即歸去也真言曰跢姪他一薩羅波羅薩羅二社耶毗社耶三跋折羅句羅娑三婆去音皤四莎跛那迦車目都起六莎去訶七
